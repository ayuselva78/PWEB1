<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeri Alumni UNIKU</title>
  <style>
    .highlight {
      background-color: yellow;
    }
    .featured {
      font-weight: bold;
    }
    .gallery {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .gallery-item {
      text-align: center;
    }
    .gallery img {
      transition: opacity 1s ease-in;
      opacity: 0;
      width: 150px;
      height: auto;
      border-radius: 5px;
      cursor: pointer;
    }
    .gallery img.fade-in {
      opacity: 1;
    }
    .gallery-caption {
      margin-top: 8px;
      font-size: 14px;
      font-weight: bold;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white;
      padding: 10px;
      border-radius: 5px;
      text-align: center;
      position: relative;
    }
    .close {
      cursor: pointer;
      color: #000;
      font-size: 20px;
      font-weight: bold;
      position: absolute;
      top: 10px;
      right: 20px;
    }
  </style>
</head>
<body>
  <h1 id="header">Galeri Alumni UNIKU</h1>

  <div class="gallery">
    <div class="gallery-item">
      <img src="alumni1_mod5.jpg" alt="Dede Irawan" />
      <div class="gallery-caption">Dede Irawan</div>
    </div>
    <div class="gallery-item">
      <img src="alumni2_mod5.jpg" alt="Heri Gustaman" />
      <div class="gallery-caption">Heri Gustaman</div>
    </div>
    <div class="gallery-item">
      <img src="alumni3_mod5" alt="Wawan Setiawan" />
      <div class="gallery-caption">Wawan Setiawan</div>
    </div>
    <div class="gallery-item">
      <img src="alumni_4_mod5.jpg" alt="Aah Sumiah" />
      <div class="gallery-caption">Aah Sumiah</div>
    </div>
  </div>

  <div id="myModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <img id="modalImage" src="" alt="Selected Photo" style="max-width: 90%; height: auto;" />
      <div id="modalCaption" style="margin-top: 10px; font-size: 16px; font-weight: bold; color: #333;"></div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="tugas_mod5.js"></script>
</body>
</html>
